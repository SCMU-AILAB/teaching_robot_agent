name: teaching_robot_frontend
description: 教学机器人课堂操作终端（接入 Jetson 设备端）
publish_to: none
version: 0.2.0+2
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  material_symbols_icons: ^4.2960.0
  web: ^1.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/NotoSansSC.ttf
