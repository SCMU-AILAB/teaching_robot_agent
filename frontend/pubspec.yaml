name: teaching_robot_frontend
description: 教学机器人交互展示的独立模拟版本
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/scene.png
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/NotoSansSC.ttf
