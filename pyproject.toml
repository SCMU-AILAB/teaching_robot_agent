[project]
name = "teaching-robot-agent"
version = "0.1.0"
description = "教学机器人基础层：模拟设备、Skill 与异步动作 Runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120",
    "langchain-core>=1.6.6",
    "langchain-ollama>=1.1.0",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "uvicorn>=0.37",
]

[project.optional-dependencies]
# 小车底盘串口；仅 app.car_teleop 与 robot.car_link.open_serial 需要。
car = ["pyserial>=3.5"]
speech-client = ["sounddevice>=0.5.6"]
# faster-whisper 1.2.1 仍使用 PyAV 在 19 中移除的 metadata_errors 参数。
speech = [
    "av<19",
    "faster-whisper>=1.2.1",
    # sherpa-onnx 1.13.8 的 wheel 元数据缺少对 core 的依赖声明，需显式锁定同一版本。
    "sherpa-onnx==1.13.8",
    "sherpa-onnx-core==1.13.8",
    "sounddevice>=0.5.6",
]
speech-server = [
    "av<19",
    "faster-whisper>=1.2.1",
    "piper-tts>=1.8.0",
]

[tool.basedpyright]
include = ["."]
exclude = [".venv", "**/__pycache__", ".ruff_cache"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "recommended"
failOnWarnings = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "D", "N"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "ruff>=0.16.9",
    "pyserial>=3.5",
    "types-pyserial>=3.5",
]
